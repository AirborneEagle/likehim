name: like_him
description: "Like Him — a quiet companion for the Christlike Attribute Activity from Preach My Gospel."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B2A40"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon_master.png"
    background_color: "#FBF6EC"
    theme_color: "#1B2A40"
