<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A quiet companion for the Christlike Attribute Activity from Preach My Gospel.">
  <meta name="theme-color" content="#FBF6EC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CLAA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CLAA — Christlike Attribute Activity</title>

  <style>
    html, body { background: #FBF6EC; margin: 0; padding: 0; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #211912; }
    }
    .claa-loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 24px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #6E6452;
    }
    .claa-mark {
      width: 80px; height: 80px; border-radius: 24px;
      background: linear-gradient(135deg, #5B7FA8 0%, #C9A66B 100%);
      box-shadow: 0 16px 32px -8px rgba(91,127,168,0.3);
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
