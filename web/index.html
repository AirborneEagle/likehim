<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A quiet companion for becoming more like the Savior — built around the Christlike Attribute Activity from Preach My Gospel.">
  <meta name="theme-color" content="#FBF6EC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Like Him">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Like Him — a quiet companion for becoming</title>

  <style>
    html, body { background: #FBF6EC; margin: 0; padding: 0; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #211912; }
    }
    .like-him-loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 24px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #6E6452;
    }
    .like-him-mark {
      width: 80px; height: 80px; border-radius: 24px;
      background: linear-gradient(135deg, #5B7FA8 0%, #C9A66B 100%);
      box-shadow: 0 16px 32px -8px rgba(91,127,168,0.3);
    }
  </style>
  <link rel="manifest" href="manifest.json">

  <script>
    // Defensive cleanup: if a stale service worker is registered (left over
    // from a previous Flutter build that aggressively cached assets), tear
    // it down and reload once. The current Flutter SW already self-uninstalls
    // when activated, but this catches users whose browser is stuck on an
    // older registration that hasn't been refetched yet.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length === 0) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            return ('caches' in self)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              : null;
          })
          .then(function () {
            // Reload once so the freshly-fetched index has no SW interception.
            // Use sessionStorage to avoid an infinite reload loop if something
            // goes wrong.
            if (!sessionStorage.getItem('like_him_sw_cleared')) {
              sessionStorage.setItem('like_him_sw_cleared', '1');
              location.reload();
            }
          });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
